# kitty.conf
#
# Only the settings that differ from kitty's defaults. Run
# `kitty --debug-config` to see the full resolved config, or grab the
# annotated reference from https://sw.kovidgoyal.net/kitty/conf/

font_size 17.0

# Send left Option as Alt, so zsh word jumps (alt+b / alt+f) and
# fzf's alt+c (cd into a directory) work.
macos_option_as_alt left
