onboarding = false

[ui]
agent_panel_scope = "all"

show_agent_labels_on_pane_borders = true
status_indicators = "symbols"

# Agent panel as an attention queue — blocked agents rise to the top —
# rather than grouped by space.
agent_panel_sort = "priority"

[ui.sound]
# Relative to this config file's directory, so it follows the dotfiles
# checkout instead of hardcoding a home path.
done_path = "sounds/done_quiet.mp3"
request_path = "sounds/request_quiet.mp3"

[experimental]
allow_nested = true

[theme]
name = "vesper"

[keys]
# Tabs are the frequent hop (one pane per tab), so they get the
# prefix-free binding. Requires macos_option_as_alt in kitty.conf.
switch_tab = "alt+1..9"

# Workspaces take over the prefixed digits that switch_tab vacated.
switch_workspace = "prefix+1..9"

[ui.toast]
delivery = "herdr"

# Breathing room in the sidebar lists — one blank row between entries.
[ui.sidebar.spaces]
row_gap = 1

[ui.sidebar.agents]
row_gap = 1
# One line per agent: no "machine" (all local) and no "agent" (all claude).
rows = [["state_icon", "workspace", "tab"]]
